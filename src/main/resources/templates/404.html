<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Page . </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-body mt-4 text-center">
            <h1 class="text-danger display-1">
                404
            </h1>
            <h2 th:text="${errorTitle}">Employee Not Found </h2>
            <p class="text-muted mt-3" th:text="${errorMessage}">The request Employee could not be found . </p>
            <a th:href="@{/employees}" class="btn btn-primary mt-3">Back to Employee Lists</a>
        </div>
    </div>
</div>

</body>
</html>
