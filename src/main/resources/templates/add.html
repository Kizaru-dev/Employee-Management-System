<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Page . </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-dark">
<div class="container mt-4">
    <div class="card shadow card-body">
        <form th:action="@{/employees/add}" th:object="${employee}" method="post">
            <div class="mt-4">
                <label class="form-label">FirstName</label>
                <input type="text" class="form-control" placeholder="Enter Your Name" th:field="*{firstName}" required>
            </div>
            <div class="mt-4">
                <label class="form-label">Last Name</label>
                <input type="text" class="form-control" placeholder="Enter Your LastName" th:field="*{lastName}" required>
            </div>
            <div class="mt-4">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" placeholder="Enter Your Email Address" th:field="*{email}" required>
            </div>
            <div class="mt-4">
                <label class="form-label">Phone NO</label>
                <input type="tel" class="form-control" placeholder="Enter Your Phone No." th:field="*{phoneNo}" required>
            </div>
            <div class="mt-4">
                <label class="form-label">Date Of Birth</label>
                <input type="date" class="form-control" placeholder="Enter Your Birth Date" th:field="*{dateOfBirth}" required>
            </div>

            <div class="mt-4">
                <label class="form-label">Gender</label>
                <select name="" id="gender" class="form-select" th:field="*{gender}" required>
                    <option value="">Select gender</option>
                    <option th:each="gender : ${genders}"
                            th:value="${gender}" th:text="${gender}"></option>
                </select>
            </div>

            <div class="mt-4">
                <label class="form-label">Department</label>
                <input type="text" class="form-control" placeholder="Enter your Department Name : " th:field="*{department}" required>
            </div>
            <div class="mt-4">
                <label class="form-label">Job Title</label>
                <input type="text" class="form-control" placeholder="Enter Your Job Title" th:field="*{jobTitle}" required>
            </div>
            <div class="mt-4">
                <label class="form-label">Salary</label>
                <input type="number" class="form-control" placeholder="Enter Your Salary" th:field="*{salary}" required >
            </div>
            <div class="mt-4">
                <label class="form-label">Joining Date</label>
                <input type="date" class="form-control" placeholder="Enter Date of Joining" th:field="*{joiningDate}" required >
            </div>
            <div class="mt-4">
                <label class="form-label">Employee Status</label>
                <select  id="employeeStatus" class="form-select" th:field="*{employeeStatus}" required>
                    <option value="">Select employee Status</option>
                    <option th:each="status : ${employeeStatus}"
                            th:value="${status}" th:text="${status}"></option>
                </select>
            </div>
            <div class="mt-4">
                <label class="form-label">Address</label>
                <input type="text" class="form-control" placeholder="Enter your address here" th:field="*{address}" required>
            </div>
            <div class="mt-4">
                <button class="btn btn-primary btn-md me-2" type="submit">Add Employee</button>
                <a th:href="@{/employee}" class="btn btn-danger btn-md ">Cancel</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
