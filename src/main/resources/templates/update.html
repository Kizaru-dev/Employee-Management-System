<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Update</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body class="bg-dark">
<div class="container mt-4">
  <div class="text-center">
    <h1 class="text-white">Update Employee Form Page</h1>
  </div>
  <div class="card shadow card-body mt-4">
    <div class="mt-4">
      <form th:action="@{/employee/updated/{id} (id=${employee.id})}" method="post" th:object="${employee}">
        <div class="mt-4">
          <label  class="form-label">First Name</label>
          <input type="text" th:field="*{firstName}" class="form-control" required placeholder="Enter your name : ">
        </div>
        <div class="mt-4">
          <label class="form-label">LastName</label>
          <input type="text" th:field="*{lastName}" class="form-control" required placeholder="Enter you Last name : ">
        </div>
        <div class="mt-4">
          <label class="form-label">Email</label>
          <input type="text" th:field="*{email}" class="form-control" required placeholder="Enter your Email Address : ">
        </div>
        <div class="mt-4">
          <label class="form-control">Phone No</label>
          <input type="tel" th:field="*{phoneNo}" class="form-control" required >
        </div>
        <div class="mt-4">
          <label class="form-label">Date of Birth</label>
          <input type="date" th:field="*{dateOfBirth}" class="form-control" required >
        </div>
        <div class="mt-4">
          <label class="form-label">Gender</label>
          <select name="" id="gender" class="form-select" th:field="*{gender}">
            <option value="">Select Gender</option>
            <option th:each="gender : ${genders}"
                    th:value="${gender}" th:text="${gender}"></option>
          </select>
        </div>
        <div class="mt-4">
          <label class="form-label">Department</label>
          <input type="text" th:field="*{department}" class="form-control" required placeholder="Enter Your Department">
        </div>
        <div class="mt-4">
          <label class="form-label">Job Title</label>
          <input type="text" th:field="*{jobTitle}" class="form-control" placeholder="Enter Your Job Title" required>
        </div>
        <div class="mt-4">
          <label class="form-label">Salary</label>
          <input type="number" th:field="*{salary}" class="form-control" placeholder="Enter Your Salary" required>
        </div>
        <div class="mt-4">
          <label class="form-label">Joining Date</label>
          <input type="date" th:field="*{joiningDate}" class="form-control" required>
        </div>

        <div class="mt-4">
          <label class="form-label">Employee Status</label>
          <select name="" id="" class="form-select" th:field="*{employeeStatus}">
            <option value="">Select Employee Status</option>
            <option th:each="status : ${employeeStatus}"
                    th:value="${status}" th:text="${status}"></option>
          </select>
        </div>

        <div class="mt-4">
          <label class="form-label">Address</label>
          <input type="text" class="form-control" th:field="*{address}" placeholder="Enter Your Address " required>
        </div>
        <div class="text-center mt-4">
          <button class="btn btn-md btn-primary me-4" type="submit">Update Employee</button>
          <a th:href="@{/employees}" class="btn btn-md btn-danger">Cancel</a>
        </div>
      </form>
    </div>

  </div>
</div>

</body>
</html>
